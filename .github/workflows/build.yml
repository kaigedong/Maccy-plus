name: Build and Release

on:
  push:
    branches: [master, feat/p2p-sync, refactor/rust-shared-core]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build MaccyPlus (macOS)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - id: version
        name: Determine version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            VERSION="2.7.0-beta.$SHORT_SHA"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_num=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/build-rust-macos.sh
      - run: ruby scripts/patch-xcode.rb

      - name: Build
        run: |
          xcodebuild build \
            -project Maccy.xcodeproj -scheme Maccy -configuration Release \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_num }}" \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: cd build/Build/Products/Release && zip -r Maccy.app.zip Maccy.app

      - if: steps.version.outputs.channel == 'beta'
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-macOS
          path: build/Build/Products/Release/Maccy.app.zip

      - if: steps.version.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-beta --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-beta build/Build/Products/Release/Maccy.app.zip \
            --title "MaccyPlus Beta (${{ steps.version.outputs.version }})" \
            --notes "Automated beta build ($GITHUB_SHA)." --prerelease

      - if: steps.version.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/Maccy.app.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build MaccyPlus (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - run: cargo install cargo-ndk
      - run: sudo apt-get update && sudo apt-get install -y build-essential ninja-build
      - run: bash scripts/build-rust-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Maccy-Android
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
